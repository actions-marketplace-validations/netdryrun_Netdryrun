frr defaults datacenter
hostname net
!
interface lo
 ip address 172.16.0.1/24
!
interface eth1
 ip address 10.0.1.1/30
!
interface eth2
 ip address 10.0.2.1/30
!
interface eth3
 ip address 10.0.3.1/30
!
bgp community-list standard CUSTOMER permit 65001:300
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 10.0.1.2 remote-as 65010
 neighbor 10.0.2.2 remote-as 65020
 neighbor 10.0.3.2 remote-as 65030
 address-family ipv4 unicast
  network 172.16.0.0/24
  neighbor 10.0.1.2 route-map FROM-CUSTOMER in
  neighbor 10.0.1.2 route-map ALLOW-ALL out
  neighbor 10.0.2.2 route-map FROM-PROVIDER in
  neighbor 10.0.2.2 route-map TO-PROVIDER out
  neighbor 10.0.3.2 route-map FROM-PEER in
  neighbor 10.0.3.2 route-map TO-PEER out
 exit-address-family
!
route-map FROM-CUSTOMER permit 10
 set community 65001:300
!
route-map FROM-PROVIDER permit 10
 set community 65001:200
!
route-map FROM-PEER permit 10
 set community 65001:250
!
route-map TO-PEER permit 10
 match community CUSTOMER
route-map TO-PEER permit 20
 match ip address prefix-list OWN-PREFIX
!
ip prefix-list OWN-PREFIX seq 5 permit 172.16.0.0/24
!
route-map TO-PROVIDER permit 10
 match community CUSTOMER
route-map TO-PROVIDER permit 20
 match ip address prefix-list OWN-PREFIX
!
route-map ALLOW-ALL permit 10
!
