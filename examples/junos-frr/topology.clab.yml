# Juniper cJunosEvolved (beta driver) and FRR peering eBGP. Each router has its own static default,
# so a default route leaked by the peer is received but never selected. See README.md.
name: ndr-junos-frr

topology:
  nodes:
    j1:
      kind: juniper_cjunosevolved
      image: cjunosevolved:26.2R1.7-EVO
      startup-config: configs/j1.cfg
      env:
        # the container otherwise waits 5 minutes for 36 data interfaces before booting the VM
        CPTX_NUM_IF: "1"
    frr1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr1.conf:/etc/frr/frr.conf
      exec:
        # containerlab gives linux nodes a default route via the management network. FRR sees it as a
        # kernel route with distance 0, which would beat the static default. Remove it.
        - ip route del default
  links:
    - endpoints: ["j1:eth4", "frr1:eth1"]
