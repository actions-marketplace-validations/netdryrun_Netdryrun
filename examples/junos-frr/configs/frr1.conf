frr defaults datacenter
hostname frr1
!
interface lo
 ip address 192.168.20.1/24
 ipv6 address 2001:db8:20::1/48
!
interface eth1
 ip address 10.0.100.2/30
 ipv6 address 2001:db8:100::2/64
!
ip route 0.0.0.0/0 blackhole
!
ip prefix-list OWN-LAN seq 10 permit 192.168.20.0/24
ipv6 prefix-list OWN-LAN6 seq 10 permit 2001:db8:20::/48
!
route-map EXPORT-OWN permit 10
 match ip address prefix-list OWN-LAN
 set community 65020:100
 set large-community 65020:1:1
 set metric 50
!
route-map EXPORT-OWN6 permit 10
 match ipv6 address prefix-list OWN-LAN6
!
route-map ACCEPT-ALL permit 10
!
router bgp 65020
 bgp router-id 20.20.20.20
 neighbor 10.0.100.1 remote-as 65010
 neighbor 2001:db8:100::1 remote-as 65010
 address-family ipv4 unicast
  network 192.168.20.0/24
  neighbor 10.0.100.1 route-map ACCEPT-ALL in
  neighbor 10.0.100.1 route-map EXPORT-OWN out
  no neighbor 2001:db8:100::1 activate
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:20::/48
  neighbor 2001:db8:100::1 activate
  neighbor 2001:db8:100::1 route-map ACCEPT-ALL in
  neighbor 2001:db8:100::1 route-map EXPORT-OWN6 out
 exit-address-family
!
