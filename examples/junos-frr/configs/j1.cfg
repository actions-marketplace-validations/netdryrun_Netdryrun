system {
    host-name j1;
    login {
        user admin {
            uid 500;
            class superuser;
            authentication {
                encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## SECRET-DATA
            }
        }
    }
    management-instance;
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
    }
}
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.100.1/30;
            }
            family inet6 {
                address 2001:db8:100::1/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.10.1/32;
            }
            family inet6 {
                address 2001:db8:10::1/128;
            }
        }
    }
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-OWN {
        term lan {
            from {
                route-filter 192.168.10.1/32 exact;
            }
            then accept;
        }
        term rest {
            then reject;
        }
    }
    policy-statement EXPORT-OWN6 {
        term lan {
            from {
                route-filter 2001:db8:10::1/128 exact;
            }
            then accept;
        }
        term rest {
            then reject;
        }
    }
    policy-statement ACCEPT-ALL {
        then accept;
    }
}
routing-options {
    router-id 192.168.10.1;
    autonomous-system 65010;
    static {
        route 0.0.0.0/0 discard;
    }
}
protocols {
    bgp {
        group frr1 {
            type external;
            peer-as 65020;
            import ACCEPT-ALL;
            export EXPORT-OWN;
            neighbor 10.0.100.2;
        }
        group frr1-v6 {
            type external;
            peer-as 65020;
            family inet6 {
                unicast;
            }
            import ACCEPT-ALL;
            export EXPORT-OWN6;
            neighbor 2001:db8:100::2;
        }
    }
}
