# Same triangle as ../frr-bgp, but r2 runs a "bad change": it leaks a default route to its peers.
# netdryrun should FAIL this change. CI uses it to prove the tool catches real mistakes.
name: ndr-frr-broken

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.4.1
  nodes:
    r1:
      binds:
        - ../frr-bgp/configs/daemons:/etc/frr/daemons
        - ../frr-bgp/configs/vtysh.conf:/etc/frr/vtysh.conf
        - ../frr-bgp/configs/r1.conf:/etc/frr/frr.conf
    r2:
      binds:
        - ../frr-bgp/configs/daemons:/etc/frr/daemons
        - ../frr-bgp/configs/vtysh.conf:/etc/frr/vtysh.conf
        - r2-bad.conf:/etc/frr/frr.conf
    r3:
      binds:
        - ../frr-bgp/configs/daemons:/etc/frr/daemons
        - ../frr-bgp/configs/vtysh.conf:/etc/frr/vtysh.conf
        - ../frr-bgp/configs/r3.conf:/etc/frr/frr.conf
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r1:eth2"]
