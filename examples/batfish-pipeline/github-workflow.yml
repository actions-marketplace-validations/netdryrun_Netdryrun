# Example workflow: copy to .github/workflows/ in your repository and adapt the paths.
# Job 1 runs Batfish on every push (seconds, nothing boots). Job 2 boots the lab with Netdryrun,
# only if Batfish passed. Not run by this repository's CI.
name: network change gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  batfish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      batfish:
        image: batfish/batfish
        ports: ["9996:9996", "9997:9997"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pybatfish
      - name: Wait for the Batfish service
        run: |
          for i in $(seq 60); do
            python -c 'from pybatfish.client.session import Session; Session(host="localhost").list_networks()' 2>/dev/null && exit 0
            sleep 2
          done
          echo "Batfish did not start"; exit 1
      - name: Analyse the configs
        run: python examples/batfish-pipeline/batfish_check.py examples/batfish-pipeline/configs

  netdryrun:
    needs: batfish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: netdryrun/netdryrun@v0.3.0
        with:
          path: examples/batfish-pipeline
