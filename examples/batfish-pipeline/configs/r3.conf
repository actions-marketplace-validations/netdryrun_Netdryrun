frr defaults datacenter
hostname r3
!
interface lo
 ip address 192.168.3.1/24
!
interface eth1
 ip address 10.0.23.2/30
!
interface eth2
 ip address 10.0.13.2/30
!
router bgp 65003
 bgp router-id 3.3.3.3
 neighbor 10.0.23.1 remote-as 65002
 neighbor 10.0.13.1 remote-as 65001
 address-family ipv4 unicast
  network 192.168.3.0/24
  neighbor 10.0.23.1 route-map ALLOW-ALL in
  neighbor 10.0.23.1 route-map ALLOW-ALL out
  neighbor 10.0.13.1 route-map ALLOW-ALL in
  neighbor 10.0.13.1 route-map ALLOW-ALL out
 exit-address-family
!
route-map ALLOW-ALL permit 10
!
