# Checks for the Arista cEOS + FRR pair. Run: netdryrun run examples/arista-frr
# Needs the cEOS-lab image imported locally (see topology.clab.yml).
lab: topology.clab.yml
timeout: 180   # cEOS takes a while to boot

checks:
  - type: bgp_session
    node: ceos1
    neighbor: 10.0.200.2
  - type: bgp_session
    node: frr1
    neighbor: 10.0.200.1
  - type: bgp_prefixes
    node: ceos1
    neighbor: 10.0.200.2
    min: 1
    max: 5
  - type: route
    node: ceos1
    prefix: 192.168.20.0/24
    protocol: bgp
  - type: route
    node: frr1
    prefix: 192.168.30.1/32
    protocol: bgp
  - type: ping
    node: ceos1
    source: 192.168.30.1
    target: 192.168.20.1
  - type: route          # nothing should send the Arista a default route
    node: ceos1
    prefix: 0.0.0.0/0
    protocol: bgp
    present: false

scenarios:
  - name: link to the Arista fails
    link_down: {node: frr1, interface: eth1}
    checks:
      - {type: bgp_session, node: ceos1, neighbor: 10.0.200.2, state: down}
      - {type: route, node: ceos1, prefix: 192.168.20.0/24, protocol: bgp, present: false}
