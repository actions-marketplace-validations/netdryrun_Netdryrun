frr defaults datacenter
hostname frr1
!
interface lo
 ip address 192.168.20.1/24
!
interface eth1
 ip address 10.0.200.2/30
!
router bgp 65020
 bgp router-id 20.20.20.20
 neighbor 10.0.200.1 remote-as 65030
 address-family ipv4 unicast
  network 192.168.20.0/24
  neighbor 10.0.200.1 route-map ALLOW-ALL in
  neighbor 10.0.200.1 route-map ALLOW-ALL out
 exit-address-family
!
route-map ALLOW-ALL permit 10
!
