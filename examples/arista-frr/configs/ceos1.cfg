hostname ceos1
!
service routing protocols model multi-agent
!
interface Ethernet1
   no switchport
   ip address 10.0.200.1/30
!
interface Loopback0
   ip address 192.168.30.1/32
!
ip routing
!
router bgp 65030
   router-id 30.30.30.30
   neighbor 10.0.200.2 remote-as 65020
   network 192.168.30.1/32
!
end
