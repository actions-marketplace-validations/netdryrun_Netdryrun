name: Netdryrun
description: Test network changes in a real virtual lab (containerlab) before they reach production.
author: Netdryrun
branding:
  icon: shield
  color: green

inputs:
  path:
    description: netdryrun.yml or the folder containing it
    default: "."
  containerlab-version:
    description: containerlab version to install (pinned for reproducible runs; empty = latest)
    default: "0.81.1"
  json-report:
    description: Path for the JSON evidence report
    default: netdryrun-report.json
  junit-report:
    description: Path for the JUnit XML report
    default: netdryrun-junit.xml
  upload-artifact:
    description: Upload the reports as a workflow artifact
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    default: netdryrun-report
  settle:
    description: Seconds to wait before negative checks
    default: "10"
  hold:
    description: Seconds a negative check must hold
    default: "10"
  pr-comment:
    description: "On pull requests, post (and keep updating) one comment with the verdict and evidence. Needs permissions pull-requests: write"
    default: "false"
  github-token:
    description: Token for the PR comment
    default: ${{ github.token }}
  cloud:
    description: "Upload the evidence to Netdryrun Cloud (needs permissions id-token: write; no secrets)"
    default: "false"
  cloud-url:
    description: Netdryrun Cloud address
    default: https://cloud.netdryrun.com

outputs:
  status:
    description: passed, failed or error
    value: ${{ steps.result.outputs.status }}
  passed:
    description: Number of passed checks
    value: ${{ steps.result.outputs.passed }}
  failed:
    description: Number of failed checks
    value: ${{ steps.result.outputs.failed }}
  evidence-url:
    description: Link to the evidence page (when cloud is true)
    value: ${{ steps.cloud.outputs.url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install containerlab
      shell: bash
      env:
        CLAB_VERSION: ${{ inputs.containerlab-version }}
      run: |
        if command -v containerlab >/dev/null; then
          have="$(containerlab version | awk '/version:/ {print $2; exit}')"
          if [ -n "$CLAB_VERSION" ] && [ "$have" != "$CLAB_VERSION" ]; then
            echo "::warning title=Netdryrun::containerlab $have is installed; requested $CLAB_VERSION"
          fi
        elif [ -n "$CLAB_VERSION" ]; then
          bash -c "$(curl -sL https://get.containerlab.dev)" -- -v "$CLAB_VERSION"
        else
          bash -c "$(curl -sL https://get.containerlab.dev)"
        fi
        containerlab version | grep -i version

    - name: Install Netdryrun
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH"

    - name: Run Netdryrun
      id: run
      shell: bash
      env:
        NDR_PATH: ${{ inputs.path }}
        NDR_JSON: ${{ inputs.json-report }}
        NDR_JUNIT: ${{ inputs.junit-report }}
        NDR_SETTLE: ${{ inputs.settle }}
        NDR_HOLD: ${{ inputs.hold }}
      run: |
        set +e
        # containerlab needs root on GitHub-hosted runners. Pass only what Netdryrun needs (not the
        # job's tokens, not the runner user's home). This only narrows the environment: a lab runs
        # privileged containers, so run untrusted topologies only in jobs without secrets.
        sudo env -i "PATH=$PATH" "HOME=/root" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
          netdryrun run "$NDR_PATH" \
          --json "$NDR_JSON" --junit "$NDR_JUNIT" --markdown netdryrun-summary.md --settle "$NDR_SETTLE" --hold "$NDR_HOLD"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Read result
      id: result
      if: always()
      shell: bash
      env:
        NDR_JSON: ${{ inputs.json-report }}
      run: |
        python - <<'EOF'
        import json, os
        try:
            rep = json.load(open(os.environ["NDR_JSON"]))
            out = {"status": rep["status"], "passed": rep["summary"]["passed"], "failed": rep["summary"]["failed"]}
        except Exception:
            out = {"status": "error", "passed": 0, "failed": 0}
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            for k, v in out.items():
                f.write(f"{k}={v}\n")
        EOF

    - name: Upload reports
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.json-report }}
          ${{ inputs.junit-report }}
        if-no-files-found: ignore
        retention-days: 14

    - name: Comment on the pull request
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        # A comment problem must never turn a test result red: every failure here is a warning.
        set +e
        [ -f netdryrun-summary.md ] || { echo "no summary to post"; exit 0; }
        python -c "import json; b = open('netdryrun-summary.md', encoding='utf-8').read(); json.dump({'body': '<!-- netdryrun-comment -->\n' + b}, open('netdryrun-comment.json', 'w'))"
        ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- netdryrun-comment -->")) | .id' 2>/dev/null | awk 'NR==1')
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" --input netdryrun-comment.json --silent
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" --input netdryrun-comment.json --silent
        fi
        [ $? -eq 0 ] || echo "::warning title=Netdryrun::could not comment on the PR (needs permissions pull-requests: write; fork PRs can't be commented on)"
        exit 0

    - name: Upload evidence to Netdryrun Cloud
      id: cloud
      if: always() && inputs.cloud == 'true'
      shell: bash
      env:
        NDR_JSON: ${{ inputs.json-report }}
        CLOUD_URL: ${{ inputs.cloud-url }}
      run: |
        case "$CLOUD_URL" in https://*) ;; *) echo "::warning title=Netdryrun Cloud::cloud-url must start with https://"; exit 0;; esac
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::warning title=Netdryrun Cloud::cloud: true needs 'permissions: id-token: write' on the job"; exit 0
        fi
        TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"           "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=netdryrun-cloud" | python -c "import json,sys;print(json.load(sys.stdin)['value'])")
        if ! RESP=$(curl -fsS -X POST "$CLOUD_URL/api/v1/reports" -H "Authorization: Bearer $TOKEN"              -H "Content-Type: application/json" --data-binary @"$NDR_JSON"); then
          echo "::warning title=Netdryrun Cloud::evidence upload failed"; exit 0
        fi
        # Only a plain https URL may reach the job outputs or the summary (no newlines, no markup)
        URL=$(echo "$RESP" | python -c "import json, re, sys; u = json.load(sys.stdin).get('url', ''); print(u if re.fullmatch(r'https://[A-Za-z0-9./?=&_%-]+', u) else '')")
        [ -n "$URL" ] || { echo "::warning title=Netdryrun Cloud::unexpected response from the cloud"; exit 0; }
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "**Evidence:** [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
        echo "Evidence: $URL"

    - name: Fail on failed checks
      if: steps.run.outputs.exit_code != '0'
      shell: bash
      env:
        NDR_STATUS: ${{ steps.result.outputs.status }}
      run: |
        echo "::error title=Netdryrun::network checks did not pass (status: $NDR_STATUS)"
        exit 1
