site_name: Netdryrun
site_url: https://netdryrun.com/
site_description: >-
  Netdryrun is an open-source tool that tests network changes in a real
  containerlab virtual lab before they reach production, with a pass/fail
  verdict and evidence.
site_author: Netdryrun
copyright: 'Netdryrun™ is open source under the Apache-2.0 license. Netdryrun and the Netdryrun logo are trademarks. <a href="/privacy/">Privacy</a> · <a href="/trust/">Trust</a> · <a href="/support/">Support</a> · <a href="/contact/">Contact</a>'

repo_url: https://github.com/netdryrun/netdryrun
repo_name: netdryrun/netdryrun
edit_uri: edit/main/website/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    # navigation.instant stays off on purpose: every page is plain HTML for crawlers.
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

  # --- Brand ------------------------------------------------------------------
  # Navy #041334 (from the wordmark) + amber #F59E0B accent ("dry run, not live").
  # Red/green stay reserved for pass/fail. Colors are set in stylesheets/brand.css.
  logo: assets/netdryrun-wordmark-white-tm.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # --- End brand --------------------------------------------------------------

extra_css:
  - stylesheets/brand.css

# Publish /.well-known/security.txt (MkDocs skips dot-folders by default)
exclude_docs: |
  !.well-known/
  # Draft until the owner has a postal address to publish. Never publish placeholders.
  legal-notice.md

# One page per Verdict Corpus case, written by corpus/render.py. Linked from the corpus table and in the
# sitemap, but kept out of the sidebar so 30 pages don't crowd it.
not_in_nav: |
  /corpus/*.md

# Per-page schema.org JSON-LD (FAQPage, TechArticle, BlogPosting, BreadcrumbList); the site-wide graph is in overrides/main.html.
hooks:
  - hooks/structured_data.py

plugins:
  - search
  # Self-host fonts and other external assets at build time: visitors' browsers never contact Google.
  - privacy

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - "Tutorial: test a change on your own lab": tutorial.md
  - Examples: examples.md
  - Guard recipes and scenarios: recipes.md
  - Guides:
      - "Add Netdryrun to your lab (10 minutes)": guides/your-lab.md
      - Test an FRR change in CI: guides/frr-ci.md
      - Test a SONiC change in CI: guides/sonic-ci.md
  - Reference:
      - netdryrun.yml: reference/config.md
      - CLI and reports: reference/cli.md
      - "verify (0.4, FRR only)": reference/verify.md
      - "Network Change Verdict v1 (spec)": spec/verdict-v1.md
  - GitHub Action: github-action.md
  - Batfish, then Netdryrun: batfish.md
  - AI agents (MCP): ai-agents.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Posts:
      - "Ping and 'BGP up' passed. The route leak was still there.": posts/ping-missed-the-leak.md
  - Verdict corpus: corpus.md
  - How it's built: how-its-built.md
  - When to use what: when-to-use-what.md
  - Trust and security: trust.md
  - Support and versioning: support.md
  - Design partners: design-partners.md
  - Contact: contact.md
  - Privacy notice: privacy.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/netdryrun/netdryrun
      name: Netdryrun on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/netdryrun/
      name: Netdryrun on PyPI
