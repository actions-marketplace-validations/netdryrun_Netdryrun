name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices and publishes the result to
# api.scorecard.dev (the README badge). Follows ossf/scorecard-action's example workflow, whose
# publishing rules allow no top-level env or write permissions and only approved actions in the job.
on:
  # Branch-Protection check: rerun when the protection rules change.
  branch_protection_rule:
  # Weekly, so the Maintained check stays current.
  schedule:
    - cron: "15 14 * * 0"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write   # upload SARIF to GitHub code scanning
      id-token: write          # sign the results published to api.scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
