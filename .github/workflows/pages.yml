name: Website

# Builds the MkDocs Material site in website/ and deploys it to GitHub Pages (netdryrun.com).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: python -m pip install --quiet "mkdocs-material==9.8.0"
      - name: Build llms-full.txt
        run: python website/build_llms_full.py
      - name: Build site
        working-directory: website
        run: mkdocs build --strict
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  # Tell IndexNow search engines (Bing, which feeds ChatGPT search and Copilot; Yandex; Seznam)
  # about every page after each deploy. The key file is website/docs/<key>.txt.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=$(basename -s .txt website/docs/*.txt | grep -E '^[0-9a-f]{32}$' | head -1)
          sleep 30
          URLS=$(curl -fsSL https://netdryrun.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | python3 -c "import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"netdryrun.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://netdryrun.com/$KEY.txt\",\"urlList\":$URLS}" -w "IndexNow HTTP %{http_code}\n"
