name: Website

# Builds the MkDocs Material site in website/ and deploys it to GitHub Pages (netdryrun.com).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: python -m pip install --quiet "mkdocs-material==9.8.0"
      - name: Build llms-full.txt
        run: python website/build_llms_full.py
      - name: Build site
        working-directory: website
        run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # Tell IndexNow search engines (Bing, which feeds ChatGPT search and Copilot; Yandex; Seznam)
  # about every page after each deploy. The key file is website/docs/<key>.txt.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=$(basename -s .txt website/docs/*.txt | grep -E '^[0-9a-f]{32}$' | head -1)
          sleep 30
          URLS=$(curl -fsSL https://netdryrun.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | python3 -c "import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"netdryrun.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://netdryrun.com/$KEY.txt\",\"urlList\":$URLS}" -w "IndexNow HTTP %{http_code}\n"
