# Publish server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Runs on release tags and whenever server.json changes on main. GitHub Actions OIDC proves we own
# io.github.netdryrun/*, so no personal login or stored token is needed.
name: MCP Registry

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Wait until the PyPI package in server.json exists
        run: |
          v="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          for _ in $(seq 1 40); do
            if curl -sf "https://pypi.org/pypi/netdryrun/$v/json" >/dev/null; then echo "netdryrun $v is on PyPI"; exit 0; fi
            sleep 30
          done
          echo "::error::netdryrun $v never appeared on PyPI"; exit 1
      # A release publishes on its tag; merging the release into main changes server.json again. Publishing a
      # version the registry already lists fails, so that second run checks and stops.
      - name: Skip if the registry already lists this version
        id: listed
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, urllib.request
          s = json.load(open("server.json"))
          url = "https://registry.modelcontextprotocol.io/v0/servers?search=" + s["name"]
          data = json.load(urllib.request.urlopen(url, timeout=30))
          found = set()
          def walk(x):
              if isinstance(x, dict):
                  if x.get("name") == s["name"] and "version" in x:
                      found.add(x["version"])
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          walk(data)
          print("listed=" + ("true" if s["version"] in found else "false"))
          EOF
          cat "$GITHUB_OUTPUT"
      - name: Install mcp-publisher
        if: steps.listed.outputs.listed != 'true'
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub Actions OIDC
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish
        if: steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher publish
