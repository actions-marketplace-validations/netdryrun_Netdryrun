name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Public facts match the source (version, platforms, corpus scores, llms-full.txt)
        run: python scripts/sync_facts.py --check

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # this job dogfoods pr-comment
    strategy:
      fail-fast: false
      matrix:
        example: [frr-bgp, srl-frr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: ndr
        uses: ./
        with:
          path: examples/${{ matrix.example }}
          artifact-name: report-${{ matrix.example }}
          pr-comment: ${{ matrix.example == 'frr-bgp' }}
      - name: The agent result agrees with the run
        if: always() && steps.ndr.outputs.status != ''
        run: python scripts/check_verdict.py netdryrun-verdict.json "${{ steps.ndr.outputs.status }}"

  # Proves the tool catches a real mistake: this run MUST fail.
  catches-bad-change:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: ndr
        uses: ./
        continue-on-error: true
        with:
          path: examples/frr-bgp-broken
          artifact-name: report-frr-bgp-broken
      - name: Expect failure
        run: |
          echo "status=${{ steps.ndr.outputs.status }} failed=${{ steps.ndr.outputs.failed }}"
          test "${{ steps.ndr.outputs.status }}" = "failed"
          test "${{ steps.ndr.outputs.failed }}" -ge 1
      - name: The agent result says the same, with the failures and the files tested
        run: python scripts/check_verdict.py netdryrun-verdict.json failed

  # The agent demo: Netdryrun MUST reject attempt 1 on the leak guards only (it opens the filters)
  # and accept attempt 2 (two prefix-list lines). demo.sh exits non-zero otherwise.
  agent-demo:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install containerlab and Netdryrun
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)" -- -v 0.81.1
          python -m pip install --quiet .
      - name: Replay the agent demo
        run: sudo env -i "PATH=$PATH" "HOME=/root" "OUT=$RUNNER_TEMP/agent-demo" bash examples/agent-demo/demo.sh
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent-demo-reports
          path: ${{ runner.temp }}/agent-demo/
          if-no-files-found: ignore
