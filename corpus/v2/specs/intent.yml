# The Netdryrun intent spec for corpus v2, written ONCE from v2/INTENT.md before any v2 case
# existed, and used unchanged for every case. It is deliberately not tuned per case: if a bad
# change slips past these checks, that row is a published loss.
lab: topology.clab.yml
timeout: 90

checks:
  # Sessions (I1)
  - {type: bgp_session, node: pe1, neighbor: 10.0.1.2, name: "I1 pe1-ce1 session up"}
  - {type: bgp_session, node: pe1, neighbor: 10.0.2.2, name: "I1 pe1-up1 session up"}
  - {type: bgp_session, node: pe1, neighbor: 10.0.3.2, name: "I1 pe1-pe2 iBGP up"}
  - {type: bgp_session, node: pe2, neighbor: 10.0.4.2, name: "I1 pe2-peer1 session up"}

  # Customer and own routes reach the upstream and the peer (I2)
  - {type: route, node: up1, prefix: 10.100.0.0/24, protocol: bgp, name: "I2 upstream has customer route"}
  - {type: route, node: up1, prefix: 192.0.2.0/24, protocol: bgp, name: "I2 upstream has our aggregate"}
  - {type: route, node: peer1, prefix: 10.100.0.0/24, protocol: bgp, name: "I2 peer has customer route"}
  - {type: route, node: peer1, prefix: 192.0.2.0/24, protocol: bgp, name: "I2 peer has our aggregate"}

  # Customer gets the internet: upstream and peer routes plus a default (I3)
  - {type: route, node: ce1, prefix: 203.0.113.0/24, protocol: bgp, name: "I3 customer has upstream route"}
  - {type: route, node: ce1, prefix: 198.51.100.0/24, protocol: bgp, name: "I3 customer has peer route"}
  # active: false - the lab's management default route outranks it; receiving it is the intent
  - {type: route, node: ce1, prefix: 0.0.0.0/0, protocol: bgp, active: false, name: "I3 customer has default"}
  - {type: ping, node: ce1, source: 10.100.0.1, target: 203.0.113.1, name: "I3 customer reaches upstream"}
  - {type: ping, node: ce1, source: 10.100.0.1, target: 198.51.100.1, name: "I3 customer reaches peer"}

  # No route leaks: upstream/peer routes never go to the other (I4)
  - {type: route, node: up1, prefix: 198.51.100.0/24, protocol: bgp, present: false, name: "I4 no peer route leaked to upstream"}
  - {type: route, node: peer1, prefix: 203.0.113.0/24, protocol: bgp, present: false, name: "I4 no upstream route leaked to peer"}
  - {type: route, node: peer1, prefix: 0.0.0.0/0, protocol: bgp, present: false, name: "I4 no default leaked to peer"}

  # We announce our aggregate and the customer, within the customer's limit (I5).
  # A range, not an exact count: the customer may grow inside its /16.
  - {type: bgp_prefixes, node: up1, neighbor: 10.0.2.1, min: 2, max: 51, name: "I5 upstream receives 2 to 51 prefixes from us"}
  - {type: bgp_prefixes, node: peer1, neighbor: 10.0.4.1, min: 2, max: 51, name: "I5 peer receives 2 to 51 prefixes from us"}

  # No infrastructure routes outside the AS or at the customer (I6)
  - {type: route, node: ce1, prefix: 10.0.1.0/30, protocol: bgp, present: false, name: "I6 customer has no BGP route for link 10.0.1.0/30"}
  - {type: route, node: ce1, prefix: 10.0.2.0/30, protocol: bgp, present: false, name: "I6 customer has no BGP route for link 10.0.2.0/30"}
  - {type: route, node: ce1, prefix: 10.0.3.0/30, protocol: bgp, present: false, name: "I6 customer has no BGP route for link 10.0.3.0/30"}
  - {type: route, node: ce1, prefix: 10.0.4.0/30, protocol: bgp, present: false, name: "I6 customer has no BGP route for link 10.0.4.0/30"}
  - {type: route, node: ce1, prefix: 10.255.0.1/32, protocol: bgp, present: false, name: "I6 customer has no BGP route for pe1 loopback"}
  - {type: route, node: ce1, prefix: 10.255.0.2/32, protocol: bgp, present: false, name: "I6 customer has no BGP route for pe2 loopback"}
  - {type: route, node: up1, prefix: 10.0.1.0/30, protocol: bgp, present: false, name: "I6 upstream has no BGP route for link 10.0.1.0/30"}
  - {type: route, node: up1, prefix: 10.0.2.0/30, protocol: bgp, present: false, name: "I6 upstream has no BGP route for link 10.0.2.0/30"}
  - {type: route, node: up1, prefix: 10.0.3.0/30, protocol: bgp, present: false, name: "I6 upstream has no BGP route for link 10.0.3.0/30"}
  - {type: route, node: up1, prefix: 10.0.4.0/30, protocol: bgp, present: false, name: "I6 upstream has no BGP route for link 10.0.4.0/30"}
  - {type: route, node: up1, prefix: 10.255.0.1/32, protocol: bgp, present: false, name: "I6 upstream has no BGP route for pe1 loopback"}
  - {type: route, node: up1, prefix: 10.255.0.2/32, protocol: bgp, present: false, name: "I6 upstream has no BGP route for pe2 loopback"}
  - {type: route, node: peer1, prefix: 10.0.1.0/30, protocol: bgp, present: false, name: "I6 peer has no BGP route for link 10.0.1.0/30"}
  - {type: route, node: peer1, prefix: 10.0.2.0/30, protocol: bgp, present: false, name: "I6 peer has no BGP route for link 10.0.2.0/30"}
  - {type: route, node: peer1, prefix: 10.0.3.0/30, protocol: bgp, present: false, name: "I6 peer has no BGP route for link 10.0.3.0/30"}
  - {type: route, node: peer1, prefix: 10.0.4.0/30, protocol: bgp, present: false, name: "I6 peer has no BGP route for link 10.0.4.0/30"}
  - {type: route, node: peer1, prefix: 10.255.0.1/32, protocol: bgp, present: false, name: "I6 peer has no BGP route for pe1 loopback"}
  - {type: route, node: peer1, prefix: 10.255.0.2/32, protocol: bgp, present: false, name: "I6 peer has no BGP route for pe2 loopback"}

  # No third-party space from us: a sentinel list of well-known prefixes, not a full guarantee (I7)
  - {type: route, node: ce1, prefix: 1.1.1.0/24, protocol: bgp, present: false, name: "I7 customer has no route for 1.1.1.0/24"}
  - {type: route, node: ce1, prefix: 8.8.8.0/24, protocol: bgp, present: false, name: "I7 customer has no route for 8.8.8.0/24"}
  - {type: route, node: ce1, prefix: 9.9.9.0/24, protocol: bgp, present: false, name: "I7 customer has no route for 9.9.9.0/24"}
  - {type: route, node: up1, prefix: 1.1.1.0/24, protocol: bgp, present: false, name: "I7 upstream has no route for 1.1.1.0/24"}
  - {type: route, node: up1, prefix: 8.8.8.0/24, protocol: bgp, present: false, name: "I7 upstream has no route for 8.8.8.0/24"}
  - {type: route, node: up1, prefix: 9.9.9.0/24, protocol: bgp, present: false, name: "I7 upstream has no route for 9.9.9.0/24"}
  - {type: route, node: peer1, prefix: 1.1.1.0/24, protocol: bgp, present: false, name: "I7 peer has no route for 1.1.1.0/24"}
  - {type: route, node: peer1, prefix: 8.8.8.0/24, protocol: bgp, present: false, name: "I7 peer has no route for 8.8.8.0/24"}
  - {type: route, node: peer1, prefix: 9.9.9.0/24, protocol: bgp, present: false, name: "I7 peer has no route for 9.9.9.0/24"}

scenarios:
  # I8: the customer floods us with 200 more-specifics from its own /16 (inside the import filter)
  - name: customer floods 200 prefixes
    inject_routes: {node: ce1, count: 200, from: 10.100.16.0/24}
    checks:
      - {type: bgp_prefixes, node: up1, neighbor: 10.0.2.1, max: 51, hold: 20, name: "I8 upstream still receives at most 51 prefixes"}
      - {type: bgp_prefixes, node: peer1, neighbor: 10.0.4.1, max: 51, hold: 20, name: "I8 peer still receives at most 51 prefixes"}

  # I9: the peer announces a more-specific of our customer and a third-party /24, via a foreign AS
  - name: peer announces routes it does not own
    inject_routes: {node: peer1, prefixes: [10.100.0.0/25, 8.8.8.0/24], as_path: [65400]}
    checks:
      - {type: bgp_prefixes, node: pe2, neighbor: 10.0.4.2, max: 1, hold: 20, name: "I9 pe2 accepts only the peer's own prefix"}
      - {type: route, node: ce1, prefix: 10.100.0.0/25, protocol: bgp, present: false, hold: 20, name: "I9 customer gets no hijacking more-specific"}
      - {type: route, node: pe1, prefix: 8.8.8.0/24, protocol: bgp, present: false, hold: 20, name: "I9 pe1 has no third-party route from the peer"}
