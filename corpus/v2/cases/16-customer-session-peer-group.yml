id: 16-customer-session-peer-group
title: Customer session moved into a CUSTOMERS peer-group
category: refactor
expected: safe
rationale: A refactor that moves the customer's route-maps and limit onto a peer-group so future customers share them. The customer's effective policy is unchanged.
edits:
- node: pe1
  replace: " neighbor 10.0.1.2 remote-as 65100\n"
  with: " neighbor CUSTOMERS peer-group\n neighbor 10.0.1.2 remote-as 65100\n neighbor 10.0.1.2 peer-group CUSTOMERS\n"
- node: pe1
  replace: "  neighbor 10.0.1.2 route-map FROM-CUSTOMER in\n  neighbor 10.0.1.2 route-map TO-CUSTOMER out\n  neighbor 10.0.1.2 maximum-prefix 50 restart 1\n"
  with: "  neighbor CUSTOMERS route-map FROM-CUSTOMER in\n  neighbor CUSTOMERS route-map TO-CUSTOMER out\n  neighbor CUSTOMERS maximum-prefix 50 restart 1\n"
