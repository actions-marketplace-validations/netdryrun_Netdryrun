id: 05-customer-max-prefix-removed
title: Customer maximum-prefix safety limit removed
category: latent-risk
expected: unsafe
rationale: Nothing changes in steady state, but a customer that floods us with more-specifics from its /16 would now have all of them accepted and passed to the upstream and the peer. Reviewers reject removing safety limits. (Re-expresses v1 case 21, now with a limit that can trip.)
edits:
- node: pe1
  replace: "  neighbor 10.0.1.2 maximum-prefix 50 restart 1\n"
  with: ''
