id: 11-customer-max-prefix-warning-only
title: Customer maximum-prefix changed to warning-only
category: latent-risk
expected: unsafe
rationale: The limit now only logs a warning instead of shutting the session, so a customer flood is accepted and passed on. A common "temporary" change after a limit tripped once. Nothing changes in steady state.
edits:
- node: pe1
  replace: '  neighbor 10.0.1.2 maximum-prefix 50 restart 1'
  with: '  neighbor 10.0.1.2 maximum-prefix 50 warning-only'
