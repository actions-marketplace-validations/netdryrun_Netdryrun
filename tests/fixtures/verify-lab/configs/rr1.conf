frr defaults datacenter
hostname rr1
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.4.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.5.1/30
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.2
!
router bgp 65000
 bgp router-id 10.255.0.2
 neighbor 192.0.2.1 remote-as internal
 neighbor 192.0.2.1 update-source lo
 neighbor 10.255.0.9 remote-as internal
 neighbor 10.255.0.9 update-source lo
 address-family ipv4 unicast
  neighbor 192.0.2.1 route-reflector-client
  neighbor 10.255.0.9 route-reflector-client
 exit-address-family
!
