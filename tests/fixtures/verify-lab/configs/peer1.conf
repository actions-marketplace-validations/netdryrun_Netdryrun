frr defaults datacenter
hostname peer1
!
interface lo
 ip address 198.51.100.1/24
!
interface eth1
 ip address 10.0.3.2/30
 ipv6 address 2001:db8:11::2/64
!
ipv6 route 2001:db8:20::/48 blackhole
!
route-map NO-EXPORT permit 10
 set community no-export 65300:7
!
router bgp 65300
 bgp router-id 198.51.100.1
 neighbor 10.0.3.1 remote-as 65000
 neighbor 2001:db8:11::1 remote-as 65000
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.0.3.1 route-map NO-EXPORT out
  no neighbor 2001:db8:11::1 activate
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:20::/48
  neighbor 2001:db8:11::1 activate
  neighbor 2001:db8:11::1 route-map NO-EXPORT out
 exit-address-family
!
