frr defaults datacenter
hostname cust2
!
interface lo
 ip address 10.201.0.1/24
!
interface eth1
 ip address 10.10.1.2/30
!
route-map ALL permit 10
!
router bgp 65101
 bgp router-id 10.201.0.1
 neighbor 10.10.1.1 remote-as 65000
 address-family ipv4 unicast
  network 10.201.0.0/24
  neighbor 10.10.1.1 route-map ALL in
  neighbor 10.10.1.1 route-map ALL out
 exit-address-family
!
