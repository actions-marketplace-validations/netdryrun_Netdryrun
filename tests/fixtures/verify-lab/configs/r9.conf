frr defaults datacenter
hostname r9
!
interface lo
 ip address 10.255.0.9/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.5.2/30
 ip ospf area 0
 ip ospf network point-to-point
!
ip route 198.18.0.0/24 blackhole
!
router ospf
 ospf router-id 10.255.0.9
!
router bgp 65000
 bgp router-id 10.255.0.9
 neighbor 10.255.0.2 remote-as internal
 neighbor 10.255.0.2 update-source lo
 address-family ipv4 unicast
  network 198.18.0.0/24
 exit-address-family
!
