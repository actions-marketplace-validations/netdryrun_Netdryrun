frr defaults datacenter
hostname up1
!
interface lo
 ip address 203.0.113.1/24
!
interface eth1
 ip address 10.0.2.2/30
!
interface eth2
 ip address 10.0.6.2/30
!
ip prefix-list UP1-BLOCK seq 10 permit 203.0.113.0/24
!
! the attributes the snapshot must read: MED, standard, large and extended communities (a route target
! and a link bandwidth)
route-map TO-EDGE permit 10
 match ip address prefix-list UP1-BLOCK
 set metric 50
 set community 65200:100 65200:200
 set large-community 65200:1:1 65200:2:2
 set extcommunity rt 65200:100
 set extcommunity bandwidth 1000
route-map TO-EDGE permit 20
!
router bgp 65200
 bgp router-id 203.0.113.1
 neighbor 10.0.2.1 remote-as 65000
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.0.2.1 default-originate
  neighbor 10.0.2.1 route-map TO-EDGE out
 exit-address-family
!
