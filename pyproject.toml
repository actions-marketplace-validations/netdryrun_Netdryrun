[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netdryrun"
version = "0.3.0"
description = "Test network changes before they touch production: real virtual labs, behavioral checks, evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Netdryrun" }]
keywords = [
  "network testing", "network automation", "bgp", "containerlab", "frr", "srlinux",
  "netdevops", "network change validation", "mcp", "ci",
]
# The license is the SPDX expression above (PEP 639 License-Expression). PEP 639 deprecates License classifiers, so none is listed.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Networking",
]
dependencies = ["pyyaml>=6.0", "mcp>=2.0,<3"]

[project.optional-dependencies]
mcp = []  # kept so `pip install "netdryrun[mcp]"` keeps working; MCP is now built in
dev = ["pytest>=8.0", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://netdryrun.com"
Documentation = "https://netdryrun.com/getting-started/"
Changelog = "https://github.com/netdryrun/netdryrun/blob/main/CHANGELOG.md"
Issues = "https://github.com/netdryrun/netdryrun/issues"
Source = "https://github.com/netdryrun/netdryrun"

[project.scripts]
netdryrun = "netdryrun.cli:main"
netdryrun-mcp = "netdryrun.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netdryrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
